    (function () {

        L.marker([p.lat, p.lon]).addTo(map).bindPopup(p.label);

      });
      if (latlngs.length === 1) {
        map.setView(latlngs[0], 11);
      } else {
        map.fitBounds(latlngs, { padding: [40, 40] });

    })();
