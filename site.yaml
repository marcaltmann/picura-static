# Global site config. Read by build.py.
title: Marc Altmann — Photography
base_url: https://photos.marcaltmann.com
author: Marc Altmann

# Custom domain for GitHub Pages. When set, the build writes a CNAME file
# into dist/ so the domain survives every (force-pushed) deploy.
cname: photos.marcaltmann.com

# Explicit album ordering on the index page; falls back to date-descending
# for any album not listed here.
album_order: [2026-japan]

# Derivative image sizes generated by build.py's fan-out step.
# Darktable already exports the display size; thumb is generated from it.
# Quality lives per-format, not per-size: each codec's quality scale is
# different, so a single number can't mean the same thing across them. AVIF
# at ~60 lands near WebP at ~80 in perceptual quality while staying smaller.
images:
  thumb:   { width: 600 }
  display: { width: 2000 }
  formats:
    avif: { quality: 60 }
    webp: { quality: 80 }
    jpeg: { quality: 82 }
