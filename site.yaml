# Global site config. Read by build.py.
title: Marc Altmann — Photography
base_url: https://photos.example.com
author: Marc Altmann

# Explicit album ordering on the index page; falls back to date-descending
# for any album not listed here.
album_order: [2026-japan]

# Derivative image sizes generated by build.py's fan-out step.
# Darktable already exports the display size; thumb is generated from it.
images:
  thumb:   { width: 600,  quality: 80 }
  display: { width: 2000, quality: 82 }
  formats: [avif, webp, jpeg]
